[project]
name = "gpt2-mlx"
version = "0.1.0"
description = "Educational GPT-2 implementation skeleton in MLX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.26.0",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "todo: intentionally-red contract test for a learner TODO (excluded from CI gate)",
]

[tool.pyright]
include = ["gpt2_mlx", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# MLX does not ship type stubs; do not fail the type check on that alone.
reportMissingTypeStubs = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

