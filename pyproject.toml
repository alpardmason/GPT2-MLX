[project]
name = "gpt2-mlx"
version = "0.1.0"
description = "Educational GPT-2 implementation skeleton in MLX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.26.0",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

